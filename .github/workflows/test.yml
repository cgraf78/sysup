name: Tests

on:
  pull_request:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # default branch so retired aliases cannot hide CI drift.
    branches: [main]
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@dc7be3dcf6da264083f229d78818c2ad087a3d34
    with:
      # The dispatcher must survive macOS Bash 3.2, while the Linux backends
      # exercise package and service policy under several userlands. Keep the
      # complete compatibility matrix on every change to this safety boundary.
      matrix-set: full
      profiles: base
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: SYSUP_SKIP_SHELLCHECK=1 test/run

  macos-bash32:
    name: Stock macOS Bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise installed dispatcher with stock macOS Bash
        shell: /bin/bash {0}
        run: |-
          set -euo pipefail
          [[ ${BASH_VERSINFO[0]} -eq 3 && ${BASH_VERSINFO[1]} -eq 2 ]]

          install_prefix="$RUNNER_TEMP/sysup-bash32"
          PREFIX="$install_prefix" /bin/bash install.sh
          [[ -L "$install_prefix/bin/sysup" ]]

          help_output=$(/bin/bash "$install_prefix/bin/sysup" --help)
          [[ "$help_output" == *"Usage: sysup"* ]]

  required:
    name: Required
    if: ${{ always() }}
    needs: [shell, macos-bash32]
    runs-on: ubuntu-24.04
    env:
      SHELL_RESULT: ${{ needs.shell.result }}
      BASH32_RESULT: ${{ needs.macos-bash32.result }}
    steps:
      - name: Require all Sysup compatibility checks
        shell: bash
        run: |-
          printf 'Shared shell CI: %s\n' "$SHELL_RESULT"
          printf 'Stock macOS Bash 3.2: %s\n' "$BASH32_RESULT"

          test "$SHELL_RESULT" = success
          test "$BASH32_RESULT" = success

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@dc7be3dcf6da264083f229d78818c2ad087a3d34
