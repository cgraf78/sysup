name: Tests

on:
  pull_request:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # default branch so retired aliases cannot hide CI drift.
    branches: [main]
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@6ecbf5dafaeb9483aeeba3915321544b31572172
    with:
      # The dispatcher must survive macOS Bash 3.2, while the Linux backends
      # exercise package and service policy under several userlands. Keep the
      # complete compatibility matrix on every change to this safety boundary.
      matrix-set: full
      profiles: base
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: SYSUP_SKIP_SHELLCHECK=1 test/run

  macos-bash32:
    name: Stock macOS Bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      - name: Exercise installed dispatcher with stock macOS Bash
        shell: /bin/bash {0}
        run: |-
          set -euo pipefail
          [[ ${BASH_VERSINFO[0]} -eq 3 && ${BASH_VERSINFO[1]} -eq 2 ]]

          install_prefix="$RUNNER_TEMP/sysup-bash32"
          PREFIX="$install_prefix" /bin/bash install.sh
          [[ -L "$install_prefix/bin/sysup" ]]

          help_output=$(/bin/bash "$install_prefix/bin/sysup" --help)
          [[ "$help_output" == *"Usage: sysup"* ]]

  distros:
    name: End to end (${{ matrix.image }})
    # The unit suites mock every package manager; this runs the real sysup
    # against the real package manager and systemd in each supported family.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image:
          - docker.io/library/debian:stable
          - docker.io/library/ubuntu:latest
          - docker.io/library/archlinux:latest
          - docker.io/library/fedora:latest
          - docker.io/rockylinux/rockylinux:9
          - docker.io/opensuse/tumbleweed:latest
          - docker.io/opensuse/leap:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      - name: Unload the runner's unix-chkpwd AppArmor profile
        # Ubuntu 24.04 runners attach this profile by path, so it also confines
        # /usr/sbin/unix_chkpwd inside containers. It denies the helper DAC
        # capabilities there, and PAM's account check then fails sudo for the
        # non-root user on images whose pam_unix calls the helper (Rocky).
        # Remove it by name through apparmorfs, so the step does not depend on
        # which file under /etc/apparmor.d defines it.
        run: |-
          if sudo grep -q '^unix-chkpwd ' /sys/kernel/security/apparmor/profiles; then
            printf 'unix-chkpwd' | sudo tee /sys/kernel/security/apparmor/.remove >/dev/null
          fi

      - name: Run sysup end to end
        # Pass the image through the environment, never by interpolating it
        # into the script.
        env:
          IMAGE: ${{ matrix.image }}
        run: test/e2e/distro-run "$IMAGE"

  required:
    name: Required
    if: ${{ always() }}
    needs: [shell, macos-bash32, distros]
    runs-on: ubuntu-24.04
    env:
      SHELL_RESULT: ${{ needs.shell.result }}
      BASH32_RESULT: ${{ needs.macos-bash32.result }}
      DISTROS_RESULT: ${{ needs.distros.result }}
    steps:
      - name: Require all Sysup compatibility checks
        shell: bash
        run: |-
          printf 'Shared shell CI: %s\n' "$SHELL_RESULT"
          printf 'Stock macOS Bash 3.2: %s\n' "$BASH32_RESULT"
          printf 'Distribution end to end: %s\n' "$DISTROS_RESULT"

          test "$SHELL_RESULT" = success
          test "$BASH32_RESULT" = success
          test "$DISTROS_RESULT" = success

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@6ecbf5dafaeb9483aeeba3915321544b31572172
